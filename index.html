<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعلم الإنجليزية للمواقف اليومية | Daily English</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-green: #10b981;
      --accent-blue: #0ea5e9;
      --border: #e2e8f0;
      --shadow: 0 4px 15px -3px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      padding: 35px 20px;
      text-align: center;
      border-bottom: 5px solid var(--primary);
    }

    header h1 {
      font-family: 'Poppins', 'Tajawal', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .main-container {
      max-width: 1000px;
      margin: 25px auto 0;
      padding: 0 20px;
    }

    .controls-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 10px;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--text-main);
    }

    .speed-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }

    .nav-categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 5px;
      margin-bottom: 25px;
      scrollbar-width: thin;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .content-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.4rem;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-right: 4px solid var(--primary);
      padding-right: 12px;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .vocab-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vocab-card:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .en-term {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      display: block;
      direction: ltr;
      text-align: left;
    }

    .ar-term {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-audio {
      background: var(--primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .vocab-card:hover .btn-audio {
      background: var(--primary-hover);
    }

    .dialogue-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .dialogue-bubble {
      padding: 16px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border-right: 4px solid #cbd5e1;
      background: #f1f5f9;
    }

    .dialogue-bubble:hover {
      background: #e2e8f0;
      transform: translateX(-3px);
    }

    .dialogue-bubble.speaker-a {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dialogue-bubble.speaker-b {
      border-color: var(--accent-green);
      background: #ecfdf5;
    }

    .dialogue-en {
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      direction: ltr;
      text-align: left;
    }

    .dialogue-ar {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .quiz-box {
      background: #f0f9ff;
      border: 2px dashed var(--accent-blue);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    .quiz-question {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
      transition: opacity 0.3s ease;
    }

    .quiz-btn {
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-btn:hover {
      border-color: var(--accent-blue);
      background: #e0f2fe;
    }

    .quiz-btn.correct-btn {
      background: #10b981 !important;
      color: white !important;
      border-color: #10b981 !important;
      transform: scale(1.05);
    }

    .quiz-btn.wrong-btn {
      background: #ef4444 !important;
      color: white !important;
      border-color: #ef4444 !important;
    }

    .quiz-box.success-pulse {
      border-color: #10b981;
      background: #ecfdf5;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }

    .quiz-box.error-pulse {
      border-color: #ef4444;
      background: #fef2f2;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
    }

    .restart-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: var(--primary-hover);
    }

    .fade-anim {
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quiz-feedback {
      margin-top: 15px;
      font-weight: 700;
      font-size: 1.1rem;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <header>
    <h1>English for Daily Life</h1>
    <p>تعلم اللغة الإنجليزية للمواقف اليومية بالصوت التفاعلي والترجمة</p>
  </header>

  <div class="main-container">

    <div class="controls-bar">

      <div class="speed-control">

          <option value="0.5">0.5x (بطيء جداً للمبتدئين)</option>
          <option value="0.75" selected>0.75x (بطيء / مناسب للتعلم)</option>
          <option value="1.0">1.0x (سرعة طبيعية)</option>
          <option value="1.25">1.25x (سريع)</option>
        </select>
      </div>
    </div>

    <div class="nav-categories">
      <button class="cat-btn active" onclick="switchCategory('airport', event)">✈️ المطار</button>
      <button class="cat-btn" onclick="switchCategory('hospital', event)">🏥 المستشفى</button>
      <button class="cat-btn" onclick="switchCategory('hotel', event)">🏨 الفندق</button>
      <button class="cat-btn" onclick="switchCategory('office', event)">🏢 الإدارات والمكاتب</button>
      <button class="cat-btn" onclick="switchCategory('shopping', event)">🛍️ التسوق</button>
      <button class="cat-btn" onclick="switchCategory('restaurant', event)">🍽️ المطعم</button>
      <button class="cat-btn" onclick="switchCategory('taxi', event)">🚖 التاكسي والنقل</button>
      <button class="cat-btn" onclick="switchCategory('cafe', event)">☕ المقهى</button>
      <button class="cat-btn" onclick="switchCategory('bank', event)">🏦 البنك والمال</button>
    </div>

    <div class="content-card">

      <div class="vocab-grid" id="vocabContainer"></div>

      <h2 class="section-title" style="margin-top: 30px;">حوارات تفاعلية</h2>
      <div class="dialogue-list" id="dialogueContainer"></div>
    </div>

    <div class="quiz-box" id="quizBox">

      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div id="quizActionContainer"></div>
    </div>

  </div>

    let currentCategory = 'airport';

    // دالة خلط مصفوفة عشوائياً (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      let shuffled = JSON.parse(JSON.stringify(array));
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // تجهيز الأسئلة مع خلط خيارات كل سؤال
    function prepareQuizzes(categoryKey) {
      const originalQuizzes = data[categoryKey].quizzes || [];
      const shuffledQuestions = shuffleArray(originalQuizzes);

      return shuffledQuestions.map(q => {
        const correctAnswerText = q.options[q.correct];
        const shuffledOptions = shuffleArray(q.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
        return {
          q: q.q,
          options: shuffledOptions,
          correct: newCorrectIndex
        };
      });
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const cleanText = text.replace(/^[A-Za-z]+:\s*/, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        
        const selectedSpeed = parseFloat(document.getElementById('speedRate').value);
        utterance.rate = selectedSpeed;
        
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("المتصفح الخاص بك لا يدعم خاصية النطق الصوتي.");
      }
    }

    function switchCategory(cat, evt) {
      currentCategory = cat;
      resetAndStartQuiz();
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if(evt) evt.target.classList.add('active');
      renderContent();
    }

    function resetAndStartQuiz() {
      currentQuizIndex = 0;
      isAnswering = false;
      activeQuizzes = prepareQuizzes(currentCategory);
      loadQuiz();
    }

    function renderContent() {
      const vocabContainer = document.getElementById('vocabContainer');
      const dialogueContainer = document.getElementById('dialogueContainer');
      const catData = data[currentCategory];

      vocabContainer.innerHTML = catData.vocab.map(item => `
        <div class="vocab-card" onclick="speakText('${item.en.replace(/'/g, "\\'")}')">
          <div>
            <span class="en-term">${item.en}</span>
            <span class="ar-term">${item.ar}</span>
          </div>
          <button class="btn-audio">🔊</button>
        </div>
      `).join('');

      dialogueContainer.innerHTML = catData.dialogue.map(item => `
        <div class="dialogue-bubble speaker-${item.speaker}" onclick="speakText('${item.en.replace(/'/g, "\\'")}')">
          <div class="dialogue-en">${item.en}</div>
          <div class="dialogue-ar">${item.ar}</div>
        </div>
      `).join('');
    }

    function loadQuiz() {
      const quizBox = document.getElementById('quizBox');
      const feedback = document.getElementById('quizFeedback');
      const questionEl = document.getElementById('quizQuestion');
      const optionsContainer = document.getElementById('quizOptions');
      const actionContainer = document.getElementById('quizActionContainer');

      quizBox.classList.remove('success-pulse', 'error-pulse');
      feedback.innerText = '';
      actionContainer.innerHTML = '';
      isAnswering = false;

      if (!activeQuizzes || activeQuizzes.length === 0) {
        questionEl.innerText = 'لا توجد أسئلة متاحة حالياً لهذا القسم.';
        optionsContainer.innerHTML = '';
        return;
      }

      // النهاية - إتمام كافّة الأسئلة بنجاح
      if (currentQuizIndex >= activeQuizzes.length) {
        quizBox.classList.add('success-pulse');
        questionEl.innerText = '';
        optionsContainer.innerHTML = '';
        feedback.innerText = '🎉 أحسنت! لقد أتممت كلمات هذا الفصل بنجاح 👏';
        feedback.style.color = '#10b981';
        actionContainer.innerHTML = `<button class="restart-btn" onclick="resetAndStartQuiz()">🔄 إعادة الاختبار من جديد</button>`;
        return;
      }

      const currentQuiz = activeQuizzes[currentQuizIndex];

      questionEl.classList.remove('fade-anim');
      optionsContainer.classList.remove('fade-anim');
      void questionEl.offsetWidth; // Trigger reflow
      questionEl.classList.add('fade-anim');
      optionsContainer.classList.add('fade-anim');

      questionEl.innerText = `[سؤال ${ currentQuizIndex + 1 } / ${activeQuizzes.length}] : ${currentQuiz.q}`;

      optionsContainer.innerHTML = currentQuiz.options.map((opt, idx) => `
        <button class="quiz-btn" id="btn-${idx}" onclick="checkAnswer(${idx}, ${currentQuiz.correct})">${opt}</button>
      `).join('');
    }

    function checkAnswer(selected, correct) {
      if (isAnswering) return;

      const feedback = document.getElementById('quizFeedback');
      const quizBox = document.getElementById('quizBox');
      const selectedBtn = document.getElementById(`btn-${selected}`);

      if (selected === correct) {
        isAnswering = true;
        selectedBtn.classList.add('correct-btn');
        quizBox.classList.add('success-pulse');
        
        feedback.innerText = '✨ إجابة صحيحة! أحسنت 👏';
        feedback.style.color = '#10b981';

        setTimeout(() => {
          currentQuizIndex++;
          loadQuiz();
        }, 1200);

      } else {
        isAnswering = true;
        selectedBtn.classList.add('wrong-btn');
        quizBox.classList.add('error-pulse');
        feedback.innerText = '❌ إجابة خاطئة! أعد المراجعة.';
        feedback.style.color = '#ef4444';

        // إعادة الكويز وإعادة الترتيب عشوائياً بعد الإجابة الخاطئة
        setTimeout(() => {
          resetAndStartQuiz();
        }, 1600);
      }
    }

    renderContent();
    resetAndStartQuiz();
  </script>
